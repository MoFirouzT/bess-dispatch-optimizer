name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy src

      - name: Import layers (import-linter)
        run: uv run lint-imports

      # The coined-word check reads the system word list and **skips silently** when
      # there is none, so without this the step would pass while that check did nothing.
      # `wamerican` is what provides /usr/share/dict/words on this image; the guard after
      # it is what turns a silently-inert check into a red build.
      - name: Word list (for the coined-word check)
        run: |
          sudo apt-get update && sudo apt-get install -y wamerican
          test -s /usr/share/dict/words

      - name: Docs (writing charter)
        run: uv run python scripts/lint_docs.py

      - name: Tests (pytest + solver smoke)
        # Deselect the token-gated live-API tests (`-m "not integration"`): they
        # never run in CI, so a push never spends ENTSO-E quota. Run them on demand
        # locally with the token to verify against real data.
        run: uv run pytest -m "not integration"

  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync dependencies (with forecast group)
        run: uv sync --frozen --group forecast

      - name: Forecaster gates (leakage + walk-forward coverage)
        run: uv run --group forecast pytest tests/property/test_forecaster_features.py tests/unit/test_forecaster_model.py -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      # Every optional group, unlike the `check` job above. Coverage measured on the
      # base install would report `forecaster` and `viz` as near-zero because their
      # tests skip when the stack is absent, so the number would track which groups
      # were installed rather than what is tested. This job exists to install them all.
      - name: Sync dependencies (all groups)
        run: uv sync --frozen --group forecast --group examples

      # 89% at the time this gate was added. The threshold sits below that on purpose:
      # it catches a module landing untested, not ordinary movement of a few lines.
      # Raise it when the measured number moves up; never lower it to make a push pass.
      - name: Coverage (fail under 85%)
        run: >
          uv run --group forecast --group examples pytest -m "not integration" -q
          --cov=bess --cov-report=term-missing:skip-covered --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build serving image
        run: docker build -t bess-dispatch:ci .

      - name: Smoke /health (graceful-degradation service comes up)
        run: |
          docker run -d --name bess -p 8000:8000 bess-dispatch:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "health ok"; curl -fsS http://localhost:8000/health; exit 0
            fi
            sleep 2
          done
          echo "health check failed"; docker logs bess; exit 1
