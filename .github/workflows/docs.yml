# Documentation site (mkdocs.yml).
#
# Two jobs, deliberately split. `build` runs on every push and pull request and only
# proves the site still assembles, so a renamed file or a broken nav entry fails here
# rather than silently. `deploy` publishes, and runs **only when started by hand**:
# merging this file does not put a site on the internet, and the first publish is a
# decision someone makes rather than a side effect of a commit.
#
# Before the first deploy, GitHub Pages has to be enabled for the repository with its
# source set to GitHub Actions. Without that, `deploy` fails on the last step.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync dependencies (with docs group)
        run: uv sync --frozen --group docs

      # Not `--strict`: seven links point outside `docs/` (the README, the operating
      # contract, the example scripts) and resolve in the repository rather than on the
      # site. They are warnings by design, listed in mkdocs.yml, and must not fail a build.
      - name: Build the site
        run: uv run --group docs mkdocs build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    # Manual only. See the note at the top of this file.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
