# Documentation site (mkdocs.yml).
#
# Two jobs, deliberately split. `build` runs on every push and pull request and only
# proves the site still assembles, so a renamed file or a broken nav entry fails there
# rather than silently. `deploy` publishes, and runs on pushes to `main` (and by hand,
# to re-publish without a commit). A pull request never deploys, so a branch cannot put
# anything on the live site before it merges.
#
# The repository's Pages source must be set to GitHub Actions, not "deploy from a
# branch". With the branch setting these runs go green and change nothing.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, and never cancel one midway: an interrupted Pages deployment
# leaves the site serving a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync dependencies (with docs group)
        run: uv sync --frozen --group docs

      # Not `--strict`: seven links point outside `docs/` (the README, the operating
      # contract, the example scripts) and resolve in the repository rather than on the
      # site. They are warnings by design, listed in mkdocs.yml, and must not fail a build.
      - name: Build the site
        run: uv run --group docs mkdocs build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    # Every push to `main`, plus a manual run. Never on a pull request.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
