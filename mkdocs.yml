# Documentation site over the same Markdown that renders on GitHub.
#
# GitHub is the primary rendering: the files are written for it (its math dialect,
# its anchor slugs), and the site is a convenience for reading them in order with a
# search box. Nothing here is generated from source, and no API reference is built
# from docstrings: the docs are the argument, and a dump of every module would bury
# it (docs/conventions.md §7, rule 1).
#
# Build:  uv run --group docs mkdocs serve
# Deploy: the pages workflow, run by hand (.github/workflows/docs.yml)

site_name: bess-dispatch-optimizer
site_description: Day-ahead dispatch optimization for a grid-scale battery, BE/NL.
# Where the pages workflow publishes to. Material builds the sitemap and the canonical
# link tags from this, so a wrong value is only visible to crawlers, never on the page.
site_url: https://mofirouzt.github.io/bess-dispatch-optimizer/
repo_url: https://github.com/MoFirouzT/bess-dispatch-optimizer
repo_name: MoFirouzT/bess-dispatch-optimizer
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: build/site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    # The site follows the reader's system theme, with a manual override.
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Follow system }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light }

# The reading order from architecture.md, not the directory listing.
nav:
  - Start here: index.md
  - Architecture: architecture.md
  - Results: results.md
  - The math:
      - Deterministic core: formulation.md
      - Under uncertainty: formulation-uncertainty.md
      - Evaluation semantics: formulation-evaluation.md
  - Conventions: conventions.md
  - Reference:
      - Glossary: glossary.md
      - Market reference: market_reference.md
      - Sources: references.md
  - Studies:
      - studies/README.md
      - Stochastic value: studies/stochastic-value.md
      - Forecast value: studies/forecast-value.md
      - Tail value: studies/tail-value.md
      - Bid curves: studies/bid-curves.md
      - Target normalization: studies/target-normalization.md
      - Storage duration: studies/storage-duration.md
      - Interval sharpness: studies/interval-sharpness.md
      - Drift-robust conformal: studies/drift-robust-conformal.md
      - Solve scaling: studies/solve-scaling.md
  - Decisions: decisions/README.md
  - Phase specs: specs/README.md
  - Session state: STATE.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's anchor dialect, so a `file.md#anchor` written for GitHub (and checked
      # by scripts/lint_docs.py against GitHub's rules) resolves here too. The default
      # MkDocs slugifier collapses runs of whitespace where GitHub does not, so headings
      # like "dispatch + intraday recourse" slug differently in the two renderers.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

# The ADRs and the per-phase specs are reached from their own index pages, which
# already list and describe every one. Repeating both listings in the nav would be a
# second source of truth for the same ordering (conventions §7, rule 1).
not_in_nav: |
  decisions/*.md
  specs/*.md

validation:
  # Seven links leave `docs/` (to README.md, CLAUDE.md, and examples/), which resolve
  # on GitHub and not here. GitHub is the primary rendering, so those stay as they are
  # and the site reports them rather than failing the build over them.
  unrecognized_links: warn
  absolute_links: warn
